name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Check that every reduction is a compiled definition
        run: lake env lean scripts/CheckReductions.lean
      - name: Check that the reduction checker rejects classical witnesses
        run: lake env lean scripts/CheckReductionsTest.lean
      - name: Check undecidability tactic path discovery and composition
        run: lake env lean scripts/UndecFromTest.lean
      - name: Check the declarations tagged for undec from
        run: lake env lean scripts/CheckUndecTags.lean
      - name: Check the palindrome example
        run: lake env lean examples/PalindromeGrammar.lean
      - name: Check the game examples
        run: lake env lean examples/GameReductions.lean
      - name: Check that fun_prop proves Primrec and Computable goals
        run: lake env lean scripts/FunPropTest.lean
      - name: Check derive_primcodable and primrec_rec on inductive types
        run: lake env lean scripts/FunPropDeriveTest.lean
      - name: Check derive_primcodable and primrec_rec on nested types
        run: lake env lean scripts/FunPropNestedTest.lean
      - name: Check that reduce_from composes reductions in both layers
        run: lake env lean scripts/ReduceFromTest.lean
      - name: Check that upgrade makes a synthetic halting reduction proved
        run: lake env lean scripts/UpgradeTest.lean
      - name: Check that halt_results states the consequences of a halting reduction
        run: lake env lean scripts/HaltResultsTest.lean
      - name: Check that the library makes no new keyword by accident
        run: lake env lean scripts/ReservedWordsTest.lean
      - name: Check that the headline results keep their statements
        run: lake env lean scripts/HeadlineTest.lean
      - name: Check that every declaration uses only the standard axioms
        run: lake env lean --run scripts/CheckAxioms.lean
      - name: Test the axiom check
        run: lake env lean scripts/CheckAxiomsTest.lean
      - name: Check that no metaprogram changes the environment
        run: lake env lean --run scripts/CheckMetaprograms.lean
      - name: Check that the metaprogram check rejects an injected reduction
        run: |
          out=$(lake env lean --run scripts/CheckMetaprograms.lean scripts/metaprogram-fixture) && exit 1
          for word in run_cmd addDecl modifyEnv declMapExt debug. macro_rules elab_rules @[macro] term_elab priority; do
            grep -qF "\`$word\`" <<< "$out" || { echo "not reported: $word"; exit 1; }
          done
      - name: Test the metaprogram check on small inputs
        run: lake env lean scripts/CheckMetaprogramsTest.lean
      - name: Check that Foundations depends on no problem folder
        run: lake env lean --run scripts/CheckLayering.lean
      - name: Check that the layering check rejects a hidden dependency
        run: |
          out=$(lake env lean --run scripts/CheckLayering.lean scripts/layering-fixture) && exit 1
          grep -qF 'DiagonaLean.Synthetic.Tactic -> DiagonaLean.PCP.Basic' <<< "$out"

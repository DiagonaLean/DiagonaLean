name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Check that every reduction is a compiled definition
        run: lake env lean scripts/CheckReductions.lean
      - name: Check that the reduction checker rejects classical witnesses
        run: lake env lean scripts/CheckReductionsTest.lean

name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Check that every reduction is a compiled definition
        run: lake env lean scripts/CheckReductions.lean
      - name: Check that the reduction checker rejects classical witnesses
        run: lake env lean scripts/CheckReductionsTest.lean
      - name: Check that fun_prop proves Primrec and Computable goals
        run: lake env lean scripts/FunPropTest.lean
      - name: Check that reduce_from composes reductions in both layers
        run: lake env lean scripts/ReduceFromTest.lean
      - name: Check that halt_results states the consequences of a halting reduction
        run: lake env lean scripts/HaltResultsTest.lean
      - name: Check that no metaprogram changes the environment
        run: lake env lean --run scripts/CheckMetaprograms.lean
      - name: Check that the metaprogram check rejects an injected reduction
        run: |
          out=$(lake env lean --run scripts/CheckMetaprograms.lean scripts/metaprogram-fixture) && exit 1
          for word in run_cmd addDecl modifyEnv declMapExt debug.; do
            grep -qF "\`$word\`" <<< "$out" || { echo "not reported: $word"; exit 1; }
          done
      - name: Test the metaprogram check on small inputs
        run: lake env lean scripts/CheckMetaprogramsTest.lean
      - name: Check that Foundations depends on no problem folder
        run: lake env lean --run scripts/CheckLayering.lean
      - name: Check that the layering check rejects a hidden dependency
        run: |
          out=$(lake env lean --run scripts/CheckLayering.lean scripts/layering-fixture) && exit 1
          grep -qF 'DiagonaLean.Synthetic.Tactic -> DiagonaLean.PCP.Basic' <<< "$out"
